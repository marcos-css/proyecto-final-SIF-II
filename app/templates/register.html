{% extends "base.html" %}

{% block content %}
<div class="max-w-md mx-auto mt-20">
    <div class="bg-dark-800 border border-slate-700 rounded-2xl p-8 shadow-2xl relative overflow-hidden">

        <div class="text-center mb-8">
            <h2 class="text-3xl font-bold">Crear Cuenta</h2>
            <p class="text-slate-400 mt-2">Protege y administra tus documentos</p>
        </div>

        {% if error %}
        <div class="bg-red-500/10 border border-red-500/50 text-red-400 p-3 rounded-lg mb-6 text-sm text-center">
            {{ error }}
        </div>
        {% endif %}

        <form action="/auth/register" method="post" class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Usuario</label>
                <input type="text" name="username" required
                    class="w-full bg-dark-900 border border-slate-600 rounded-lg px-4 py-3 text-white focus:ring-2 focus:ring-purple-500 focus:border-transparent outline-none transition-all">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Contraseña</label>
                <input type="password" name="password" required
                    class="w-full bg-dark-900 border border-slate-600 rounded-lg px-4 py-3 text-white focus:ring-2 focus:ring-purple-500 focus:border-transparent outline-none transition-all">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Confirmar Contraseña</label>
                <input type="password" name="confirm_password" required
                    class="w-full bg-dark-900 border border-slate-600 rounded-lg px-4 py-3 text-white focus:ring-2 focus:ring-purple-500 focus:border-transparent outline-none transition-all">
            </div>

            <button type="submit"
                class="w-full py-3 bg-purple-600 hover:bg-purple-500 text-white rounded-xl font-bold transition-all shadow-[0_4px_15px_-5px_rgba(168,85,247,0.5)] mt-4">
                Registrarse
            </button>
        </form>

        <p class="text-center text-slate-400 text-sm mt-6">
            ¿Ya tienes cuenta? <a href="/auth/login" class="text-purple-400 hover:text-purple-300 font-medium">Inicia
                sesión</a>
        </p>
    </div>
</div>
{% endblock %}
