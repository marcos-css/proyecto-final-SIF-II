{% extends "base.html" %}

{% block content %}
<div class="max-w-md mx-auto mt-20">
    <div class="bg-dark-800 border border-slate-700 rounded-2xl p-8 shadow-2xl relative overflow-hidden">

        <div class="text-center mb-8">
            <h2 class="text-3xl font-bold">Bienvenido de vuelta</h2>
            <p class="text-slate-400 mt-2">Inicia sesión para acceder a tus archivos</p>
        </div>

        {% if error %}
        <div class="bg-red-500/10 border border-red-500/50 text-red-400 p-3 rounded-lg mb-6 text-sm text-center">
            {{ error }}
        </div>
        {% endif %}

        <form action="/auth/login" method="post" class="space-y-6">
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Usuario</label>
                <input type="text" name="username" required
                    class="w-full bg-dark-900 border border-slate-600 rounded-lg px-4 py-3 text-white focus:ring-2 focus:ring-brand-500 focus:border-transparent outline-none transition-all">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Contraseña</label>
                <input type="password" name="password" required
                    class="w-full bg-dark-900 border border-slate-600 rounded-lg px-4 py-3 text-white focus:ring-2 focus:ring-brand-500 focus:border-transparent outline-none transition-all">
            </div>

            <button type="submit"
                class="w-full py-3 bg-brand-600 hover:bg-brand-500 text-white rounded-xl font-bold transition-all shadow-[0_4px_15px_-5px_rgba(99,102,241,0.5)]">
                Iniciar Sesión
            </button>
        </form>

        <p class="text-center text-slate-400 text-sm mt-6">
            ¿No tienes cuenta? <a href="/auth/register"
                class="text-brand-400 hover:text-brand-300 font-medium">Regístrate aquí</a>
        </p>
    </div>
</div>
{% endblock %}
